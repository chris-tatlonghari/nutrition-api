<!DOCTYPE html>
<html>
<head>
    <title>Category Shortcuts Mockup V2 - NutritionFax</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --nutrition-primary: rgb(101 163 13);
            --nutrition-primary-dark: rgb(63 98 18);
            --nutrition-primary-light: rgb(132 204 22);
            --nutrition-secondary: rgb(132 204 22);
            --nutrition-ink: rgb(63 98 18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Roboto", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 18% 12%, rgb(247 254 231) 0%, rgb(255 255 255) 35%, rgb(245 245 245) 75%, rgba(132, 204, 22, 0.06) 100%);
            min-height: 100vh;
        }

        .home-search-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 300px);
            padding: 40px 20px;
        }

        .home-search-content {
            width: 100%;
            max-width: 620px;
        }

        .home-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .home-header-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 36px;
        }

        .home-header-icon {
            animation: float 3s ease-in-out infinite;
        }

        .home-header-icon:nth-child(2) {
            animation-delay: 0.3s;
        }

        .home-header-icon:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .home-header-accent {
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, var(--nutrition-secondary), var(--nutrition-primary));
            margin: 0 auto 24px;
            border-radius: 2px;
        }

        .home-header-title {
            font-size: 42px;
            font-weight: 300;
            color: var(--nutrition-ink);
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .home-header-title strong {
            font-weight: 700;
            color: var(--nutrition-primary-dark);
        }

        .home-header-subtitle {
            font-size: 16px;
            color: rgb(120 120 120);
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .search-input-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 32px;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: rgb(150 150 150);
        }

        .home-search-input {
            width: 100%;
            padding: 16px 24px 16px 52px;
            font-size: 1.1rem;
            border: 2px solid rgb(220 220 220);
            border-radius: 50px;
            background: rgb(255 255 255);
            box-shadow: 0 4px 12px rgb(0 0 0 / 8%);
            transition: all 0.3s ease;
        }

        .home-search-input:focus {
            outline: none;
            border-color: var(--nutrition-secondary);
            box-shadow: 0 6px 20px rgba(132, 204, 22, 0.15);
        }

        /* Category Shortcuts - V2: Compact pill style */
        .category-shortcuts-wrapper {
            text-align: center;
            margin-top: 28px;
        }

        .category-shortcuts-label {
            font-size: 12px;
            font-weight: 600;
            color: rgb(120 120 120);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .category-shortcuts {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .category-shortcut {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: white;
            border: 2px solid rgb(226 232 240);
            border-radius: 24px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .category-shortcut:hover {
            border-color: var(--nutrition-primary);
            box-shadow: 0 4px 12px rgba(101, 163, 13, 0.2);
            transform: translateY(-2px);
            background: rgba(247, 254, 231, 0.5);
        }

        .category-shortcut-emoji {
            font-size: 20px;
            line-height: 1;
        }

        .category-shortcut-label {
            font-size: 14px;
            font-weight: 600;
            color: rgb(74 85 104);
            line-height: 1;
        }

        @media (max-width: 768px) {
            .home-header-title {
                font-size: 32px;
            }

            .category-shortcuts {
                gap: 8px;
            }

            .category-shortcut {
                padding: 8px 14px;
                gap: 6px;
            }

            .category-shortcut-emoji {
                font-size: 18px;
            }

            .category-shortcut-label {
                font-size: 13px;
            }
        }

        /* Mockup Banner */
        .mockup-banner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--nutrition-primary);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            font-weight: 600;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="home-search-container">
        <div class="home-search-content">
            <div class="home-header">
                <div class="home-header-icons">
                    <span class="home-header-icon">🥗</span>
                    <span class="home-header-icon">🍕</span>
                    <span class="home-header-icon">🌮</span>
                </div>
                <div class="home-header-accent"></div>
                <h1 class="home-header-title">Your <strong>Nutrition</strong> Calculator</h1>
                <p class="home-header-subtitle">Full nutrition transparency behind every bite for your favorite chains.</p>
            </div>

            <div class="search-input-wrapper">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" class="home-search-input" placeholder="Search for a restaurant...">
            </div>

            <!-- NEW: Category Shortcuts V2 - Pill Style -->
            <div class="category-shortcuts-wrapper">
                <div class="category-shortcuts-label">Browse by Category</div>
                <div class="category-shortcuts">
                    <a href="#" class="category-shortcut">
                        <span class="category-shortcut-emoji">🍔</span>
                        <span class="category-shortcut-label">Fast Food</span>
                    </a>

                    <a href="#" class="category-shortcut">
                        <span class="category-shortcut-emoji">☕</span>
                        <span class="category-shortcut-label">Cafe</span>
                    </a>

                    <a href="#" class="category-shortcut">
                        <span class="category-shortcut-emoji">🍽️</span>
                        <span class="category-shortcut-label">Restaurant</span>
                    </a>

                    <a href="#" class="category-shortcut">
                        <span class="category-shortcut-emoji">🥗</span>
                        <span class="category-shortcut-label">Healthy</span>
                    </a>

                    <a href="#" class="category-shortcut">
                        <span class="category-shortcut-emoji">🌯</span>
                        <span class="category-shortcut-label">Mexican</span>
                    </a>

                    <a href="#" class="category-shortcut">
                        <span class="category-shortcut-emoji">🍴</span>
                        <span class="category-shortcut-label">Other</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="mockup-banner">
        💡 Mockup V2 - Pill Style Shortcuts
    </div>
</body>
</html>
